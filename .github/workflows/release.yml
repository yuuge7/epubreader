name: Release

# Every push to main builds a signed release APK and publishes it as
# "EBook Reader v<versionName>". Bump versionName in app/build.gradle.kts to cut a
# new release; pushes that do not change it are built and then skipped, so ordinary
# commits never fail the workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Cache save/restore failures surface as warnings and never fail the build.
      # If GitHub's cache service is having an incident, add `with: cache-disabled: true`
      # to silence them at the cost of a slower build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The wrapper is stored without the executable bit, so grant it here rather
      # than depending on how the repository was checked out.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read app version
        id: version
        run: |
          VERSION="$(./gradlew -q --console=plain :app:printVersionName | tail -n 1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check whether this version was already released
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets are written to the same keystore.properties the local build uses,
      # so CI and a developer machine sign through one identical code path.
      - name: Restore signing keystore
        if: steps.check.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > epubreader-release.jks
          cat > keystore.properties <<EOF
          storeFile=epubreader-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Verify the APK is signed
        if: steps.check.outputs.exists == 'false'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Name the artifact
        if: steps.check.outputs.exists == 'false'
        id: artifact
        run: |
          NAME="EBookReader-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.artifact.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "EBook Reader ${{ steps.version.outputs.tag }}" \
            --generate-notes

      # Credentials only ever exist inside this job, but clean up anyway so a future
      # step added below this one cannot accidentally archive them.
      - name: Remove signing material
        if: always()
        run: rm -f epubreader-release.jks keystore.properties
