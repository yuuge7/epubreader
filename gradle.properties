org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true

# KSP's Gradle plugin still registers its generated sources through kotlin.sourceSets,
# which AGP 9's built-in Kotlin rejects by default. Google documents this flag as the
# supported escape hatch; drop it once KSP registers sources via android.sourceSets.
android.disallowKotlinSourceSets=false
